plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_name
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

// 依赖由独立源码项目构建，不打包第三方 JAR；支持绝对路径和同级检出。
def tinkersJar = providers.gradleProperty('tinkersNirvanaJar')
        .orElse('../TinkersNirvana-1.21.1/build/libs/TinkersNirvana-1.21.1-1.0.3.jar')
def armoryJar = providers.gradleProperty('tinkersArmoryNirvanaJar')
        .orElse('../TinkersArmoryNirvana-1.21.1/build/libs/TinkersArmoryNirvana-1.21.1-1.0.11.jar')
for (def dependency : [tinkersJar, armoryJar]) {
    if (!file(dependency.get()).isFile()) {
        throw new GradleException('Build the dependency first and supply -PtinkersNirvanaJar and -PtinkersArmoryNirvanaJar. Missing: ' + dependency.get())
    }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
configurations { runtimeClasspath.extendsFrom localRuntime }
dependencies {
    implementation files(tinkersJar.get())
    compileOnly files(armoryJar.get())
    if (!providers.gradleProperty('withoutArmory').isPresent()) { localRuntime files(armoryJar.get()) }
}
// 经验成本的极端边界无法通过常规游玩有效验证；不引入额外测试依赖。
sourceSets {
    boundaryChecks {
        java.srcDir 'src/checks/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
def experienceChecks = tasks.register('experienceChecks', JavaExec) {
    dependsOn tasks.named('boundaryChecksClasses')
    classpath = sourceSets.boundaryChecks.runtimeClasspath
    mainClass = 'com.gctn.tinkerstoolupgrade.ExperienceCostChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn experienceChecks }
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
for (String taskName : ['jar', 'sourcesJar']) {
    tasks.named(taskName, Jar) { from('LICENSE', 'NOTICE.md', 'TEMPLATE_LICENSE.txt') }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('wrapper', Wrapper).configure { distributionType = Wrapper.DistributionType.BIN }
publishing {
    publications { register('mavenJava', MavenPublication) { from components.java } }
    repositories { maven { url = layout.buildDirectory.dir('repo') } }
}
idea { module { downloadSources = true; downloadJavadoc = true } }
